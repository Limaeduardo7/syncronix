<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0;url=/">
  <title>Redirecionando...</title>
  <script>
    // Single Page Apps for GitHub Pages
    // https://github.com/rafgraph/spa-github-pages
    // Store the current pathname before redirecting
    sessionStorage.setItem('redirect', location.pathname.slice(0, -1) + location.search + location.hash);
    location.replace('/');
  </script>
</head>
<body>
  Redirecionando...
</body>
</html>
