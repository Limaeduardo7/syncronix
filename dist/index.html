    <!-- Hotmart UTM and Lead Tracking -->
    <script>
        let prefix = ["https://payment.hotmart.com", "https://pay.hotmart.com"];

        function getParams() {
            let t = "",
                e = window.top.location.href,
                r = new URL(e);
            if (null != r) {
                let a = r.searchParams.get("utm_source"),
                    n = r.searchParams.get("utm_medium"),
                    o = r.searchParams.get("utm_campaign"),
                    m = r.searchParams.get("utm_term"),
                    p = r.searchParams.get("fbclid"),
                    c = r.searchParams.get("utm_content");
                if (a || n || o || m || c) {
                    t = `&sck=${a || 'direto'}|${n || 'direto'}|${o || 'direto'}|${m || 'direto'}|${c || 'direto'}`;
                }
            }
            return t;
        }

        function getCookie(name) {
            let match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
            if (match) {
                return match[2];
            }
            return null;
        }

        function updateLinks() {
            var t = new URLSearchParams(window.location.search);
            var xcod = getCookie("lead");

            if (xcod) {
                t.append("xcod", xcod);
            }

            document.querySelectorAll("a").forEach(function (e) {
                for (let r = 0; r < prefix.length; r++) {
                    if (-1 !== e.href.indexOf(prefix[r])) {
                        // Evita adicionar parâmetros duplicados
                        if (e.href.indexOf("sck=") === -1) {
                            let params = t.toString();
                            let utmParams = getParams();

                            if (params || utmParams) {
                                if (-1 === e.href.indexOf("?")) {
                                    e.href += "?";
                                } else {
                                    e.href += "&";
                                }

                                if (params) {
                                    e.href += params;
                                }
                                if (utmParams) {
                                    e.href += utmParams;
                                }
                            }
                        }
                    }
                }
            });
        }

        // Atualiza links no carregamento
        window.addEventListener('load', function () {
            updateLinks();

            // Observa mudanças no DOM para SPA (React Router)
            const observer = new MutationObserver(function (mutations) {
                updateLinks();
            });

            observer.observe(document.body, {
                childList: true,
                subtree: true
            });
        });

        // Atualiza links quando há mudança de rota (para SPA)
        window.addEventListener('popstate', function () {
            setTimeout(updateLinks, 100);
        });
    </script>
